---
- name: Bootstrap Minikube cluster and FluxCD GitOps environment
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # Credentials: read from environment variables or passed via --extra-vars
    github_user: "{{ lookup('ansible.builtin.env', 'GITHUB_USER') | default('', true) }}"
    github_token: "{{ lookup('ansible.builtin.env', 'GITHUB_TOKEN') | default('', true) }}"
    age_key_file: "{{ playbook_dir }}/age.agekey"

    app_image: "griffin:0.0.1"
    app_src_dir: "{{ playbook_dir }}/src"
    flux_instance_file: "{{ playbook_dir }}/clusters/minikube/flux-instance.yaml"

  tasks:
    #
    # Minikube
    #
    - name: Check Minikube cluster status
      ansible.builtin.command: minikube status --format "{{ '{{' }}.Host{{ '}}' }}"
      register: minikube_status
      changed_when: false
      failed_when: false

    - name: Start Minikube cluster if not running
      ansible.builtin.command: minikube start
      when: minikube_status.stdout != "Running"

    - name: Wait for Kubernetes API to be responsive
      ansible.builtin.command: kubectl cluster-info
      register: cluster_info
      retries: 15
      delay: 3
      until: cluster_info.rc == 0
      changed_when: false

    #
    # GitHub credentials & sops age key
    #
    - name: Check if flux-system namespace exists
      ansible.builtin.command: kubectl get namespace flux-system
      register: flux_ns_check
      changed_when: false
      failed_when: false

    - name: Create flux-system namespace
      ansible.builtin.command: kubectl create namespace flux-system
      when: flux_ns_check.rc != 0

    - name: Check if flux-system basic-auth secret exists
      ansible.builtin.command: kubectl get secret flux-system -n flux-system
      register: flux_secret_check
      changed_when: false
      failed_when: false
      no_log: true

    - name: Validate GitHub credentials when secret is missing
      ansible.builtin.assert:
        that:
          - github_user | length > 0
          - github_token | length > 0
        fail_msg: "GITHUB_USER and GITHUB_TOKEN must be set to create the flux-system secret."
      when: flux_secret_check.rc != 0

    - name: Create flux-system basic-auth secret for Git repository access
      ansible.builtin.command: >
        flux-operator create secret basic-auth flux-system
        --namespace=flux-system
        --username={{ github_user }}
        --password-stdin
      args:
        stdin: "{{ github_token }}"
      when: flux_secret_check.rc != 0
      no_log: true

    - name: Check if sops-age secret exists in flux-system
      ansible.builtin.command: kubectl get secret sops-age -n flux-system
      register: sops_age_secret_check
      changed_when: false
      failed_when: false
      no_log: true

    - name: Check if local age key file exists
      ansible.builtin.stat:
        path: "{{ age_key_file }}"
      register: age_file_stat
      when: sops_age_secret_check.rc != 0

    - name: Validate age key file exists when sops-age secret is missing
      ansible.builtin.assert:
        that:
          - age_file_stat.stat.exists
        fail_msg: "Age key file '{{ age_key_file }}' was not found, must exists to create the sops-age secret."
      when: sops_age_secret_check.rc != 0

    - name: Create sops-age secret in flux-system from file
      ansible.builtin.command: >
        kubectl create secret generic sops-age
        --namespace=flux-system
        --from-file=age.agekey={{ age_key_file }}
      when: sops_age_secret_check.rc != 0
      no_log: true

    #
    # Docker Image
    #
    - name: Inspect local Docker image
      ansible.builtin.command: docker image inspect {{ app_image }} --format "{{ '{{' }}.Id{{ '}}' }}"
      register: local_docker_inspect
      changed_when: false
      failed_when: false

    - name: Build application Docker image
      ansible.builtin.command: docker build -t {{ app_image }} {{ app_src_dir }}
      when: local_docker_inspect.rc != 0

    - name: Check images present in Minikube
      ansible.builtin.command: minikube image ls
      register: minikube_images
      changed_when: false

    - name: Load application Docker image into Minikube
      ansible.builtin.command: minikube image load {{ app_image }}
      when:
        - app_image not in minikube_images.stdout
        - ('docker.io/library/' + app_image) not in minikube_images.stdout

    #
    # FluxInstance
    #
    - name: Check if FluxInstance resource exists
      ansible.builtin.command: kubectl get fluxinstance flux -n flux-system
      register: flux_instance_check
      changed_when: false
      failed_when: false

    - name: Install Flux Operator and deploy FluxInstance
      ansible.builtin.command: >
        flux-operator install -f {{ flux_instance_file }}
      when: flux_instance_check.rc != 0
