apiVersion: apps/v1
kind: Deployment
metadata:
  name: griffin
  namespace: griffin
  labels:
    app: griffin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: griffin
  template:
    metadata:
      labels:
        app: griffin
    spec:
      containers:
        - name: griffin
          image: griffin:0.0.1
          imagePullPolicy: Never # tells minikube to use the local image
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: GREETING
              value: "Greetings from deployment.yaml"
            - name: SECRET_TOKEN
              valueFrom:
                secretKeyRef:
                  name: griffin-secret
                  key: SECRET_TOKEN
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
